<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="{% url 'dashboard:home' %}">
      <span class="me-2">🛒</span>
      <span>ShopSmart</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNavbar" aria-controls="mainNavbar"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <form class="d-flex ms-lg-4 my-3 my-lg-0"
            method="get" action="{% url 'dashboard:products' %}">
        <input class="form-control me-2" type="search" name="q"
               placeholder="Search products..." value="{{ request.GET.q }}">
        <button class="btn btn-outline-warning" type="submit">Search</button>
      </form>

      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'dashboard:home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'dashboard:products' %}">Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'dashboard:cart' %}">Cart</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'dashboard:profile' %}">Profile</a>
        </li>

        {% if user.is_authenticated %}
          <li class="nav-item d-flex align-items-center ms-lg-2">
            <span class="navbar-text small me-2">
              Hi, {{ user.username }}
            </span>
            <a class="btn btn-sm btn-outline-light" href="{% url 'dashboard:logout' %}">
              Logout
            </a>
          </li>
        {% else %}
          <li class="nav-item ms-lg-2">
            <a class="btn btn-sm btn-outline-light" href="{% url 'dashboard:login' %}">
              Login
            </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
